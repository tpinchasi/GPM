name: CI

# What runs when — kept deliberately cheap, because the minutes are metered (the account hit
# 90% of its allowance in one evening of small fixes, at ~21 minutes a run, twice a change):
#
# - every pull request: the default suite on one Python, lint, the version check, the secret
#   scan, the dependency audit, and the no-spending guard — about five minutes;
# - a pull request labelled `simulation`: the whole-pool simulation as well — the gate for a
#   change to the supervisor's renting, allocation or recovery, which is where a long run finds
#   what a unit test cannot;
# - every Monday, and on request: everything, on every supported Python.
#
# main is only ever changed by merging a pull request, and a pull request is tested on its
# merge with main, so there is no separate run on push: it would be the same run again.
on:
  pull_request:
    # `labeled`, so that putting the `simulation` label on an open pull request runs it.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A new push to the same pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and stated rather than inherited: the secret scan asks GitHub which commits a pull
# request contains, and without this it is refused and the job fails on every run.
permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    # The whole default suite runs with no GPU and no cloud account — that is the point of the
    # fake provider and the fake engine, and CI is where it stays true. One Python per pull
    # request; every supported one on the weekly run.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q

  simulation:
    # A whole pool — real router, real supervisor — against a market that moves under it, for
    # long enough that hosts are rented, paused, woken and given up. Slower than the unit
    # suite by design (ten minutes), so it runs on the weekly and on-request runs, and on a
    # pull request only when it carries the `simulation` label — the gate for a change to
    # renting, allocation or recovery.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'simulation')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pytest -m simulation -q

  versions:
    # A package whose source changed in a pull request must say so in its version: a consumer
    # cannot tell what it has otherwise. Doc-only and test-only changes are not packages.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: every package whose source changed has a new version
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          missing=""
          for package in client server agent; do
            if git diff --quiet "$base"...HEAD -- "$package/src"; then continue; fi
            if git diff "$base"...HEAD -- "$package/pyproject.toml" | grep -q '^+version'; then
              echo "$package: source changed, version raised"
            else
              echo "$package: source changed and its version did not"
              missing="$missing $package"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Raise the version in:$missing (and say what changed in CHANGELOG.md)"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check client/src server/src agent/src tests
      # The console is never imported by Python, so only a JavaScript parser can tell us it
      # still parses. A syntax error there is total: the page draws nothing at all.
      - run: node --check server/src/gpm_server/console/static/app.js

  no-spending-in-ci:
    # A test that could reach a real provider must not exist in the default suite. If this job
    # ever fails, something that can spend money became reachable without an opt-in marker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: the default suite names no real provider
        run: |
          uv run python - <<'PY'
          import subprocess, sys
          collected = subprocess.run(
              ["uv", "run", "pytest", "--collect-only", "-q"],
              capture_output=True, text=True, check=True,
          ).stdout
          assert "integration" not in collected, "an integration test is in the default suite"
          print("default suite:", collected.strip().splitlines()[-1])
          PY
      - name: no provider credential is read anywhere in the default suite
        run: |
          uv run python - <<'PY'
          import pathlib, re, sys

          # A test may *assert* the account credential is absent — that is the threat model
          # holding itself to account. What must never appear is a test that **supplies** one:
          # anything that sets it, or reads it out of the environment.
          supplies = re.compile(r"(setenv|environ\s*\[|environ\.get|getenv|putenv)[^\n]*VAST_API_KEY")
          offenders = []
          for path in pathlib.Path("tests").rglob("*.py"):
              if path.name == "test_vast_provider.py":
                  continue  # the provider's own unit tests, which never reach a network
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if supplies.search(line) and "delenv" not in line:
                      offenders.append(f"{path}:{number}: {line.strip()}")
          if offenders:
              print("a default test supplies a provider credential:", *offenders, sep="\n  ")
              sys.exit(1)
          print("no default test supplies a provider credential")
          PY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # What this project actually depends on, from the lock file — not whatever the runner's
      # own python happens to carry, which is what `pip-audit` finds when pointed at a system
      # interpreter (and which failed here on a kernel-tracing package that is not on PyPI).
      - run: uv export --no-dev --no-emit-workspace --format requirements-txt > locked.txt
      - run: uvx pip-audit --strict -r locked.txt
