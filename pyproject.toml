[tool.uv.workspace]
members = ["client", "server", "agent"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real, locally-running Ollama (opt-in, not run by default)",
    "simulation: a whole pool against a moving market, minutes long (opt-in; its own CI job)",
]
addopts = "-m 'not integration and not simulation'"
# Every test here drives real servers over real sockets; a hang must fail loudly, not stall.
# A simulation runs minutes by design, and sets its own longer limit.
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The rules that catch real problems, not house style: pyflakes (unused and undefined names),
# import order, and the bugbear checks for things that behave differently than they read.
select = ["E4", "E7", "E9", "F", "I", "B"]
# Asserts carry meaning in the tests, and a bare `except Exception` in a control loop is
# deliberate — a bad pass must never take the supervisor down.
ignore = ["B011", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
