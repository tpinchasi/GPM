[project]
name = "gpm-agent"
version = "0.11.0"
description = "GPM host agent: tells a pool what a machine is and makes it hold the pool's model set."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<0.29",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
gpm-agent = "gpm_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpm_agent"]
