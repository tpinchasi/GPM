[project]
name = "gpm-server"
version = "0.1.0"
description = "GPM router: serves GPU inference from a pool of hosts behind one URL, without an app knowing where the GPU runs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27,<0.29",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.scripts]
gpm = "gpm_server.cli:main"

# First-party plug-ins load through the same entry-point mechanism a third party's would.
[project.entry-points."gpm.providers"]
fake = "gpm_server.providers.fake:FakeProvider"
vast = "gpm_server.providers.vast:VastProvider"

[project.entry-points."gpm.engines"]
ollama = "gpm_server.engines.ollama:OllamaEngine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpm_server"]
