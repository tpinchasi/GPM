[project]
name = "gpm-server"
version = "0.1.0"
description = "GPM router: serves GPU inference from a pool of hosts behind one URL, without an app knowing where the GPU runs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27,<0.29",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.scripts]
gpm = "gpm_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpm_server"]
